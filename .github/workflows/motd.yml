name: Update System MOTD
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  update-motd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Fetch Quote and Update README
        run: |
          QUOTES=(
            "\"Data is a precious thing and will last longer than the systems themselves.\" — Tim Berners-Lee"
            "\"In God we trust, all others must bring data.\" — W. Edwards Deming"
            "\"The future belongs to the companies and people that turn data into products.\" — Mike Loukides"
            "\"Artificial intelligence would be the ultimate version of Google.\" — Larry Page"
            "\"Torture the data, and it will confess to anything.\" — Ronald Coase"
            "\"Machine intelligence is the last invention that humanity will ever need to make.\" — Nick Bostrom"
            "\"Without big data, you are blind and deaf and in the middle of a freeway.\" — Geoffrey Moore"
          )
          RANDOM_QUOTE=${QUOTES[$RANDOM % ${#QUOTES[@]}]}
          sed -i "/<!-- MOTD:START -->/,/<!-- MOTD:END -->/c\<!-- MOTD:START -->\n> **System MOTD:** ${RANDOM_QUOTE}\n<!-- MOTD:END -->" README.md
          
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "Update MOTD (Message of the Day)"
          git push
