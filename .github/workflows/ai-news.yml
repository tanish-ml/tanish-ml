name: Latest AI News Feed
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
jobs:
  update-readme:
    name: Update AI News
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: gautamkrishnar/blog-post-workflow@master
        with:
          feed_list: "https://towardsdatascience.com/feed"
          max_post_count: 4
          comment_tag_name: "AI_NEWS"
